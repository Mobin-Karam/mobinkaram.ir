name: Student Core Quality

on:
  pull_request:
    paths:
      - 'student-core/**'
      - 'packages/api-contract/**'
      - '.github/workflows/student-core-quality.yml'
  push:
    branches: [develop, main]
    paths:
      - 'student-core/**'
      - 'packages/api-contract/**'
      - '.github/workflows/student-core-quality.yml'

permissions:
  contents: read

jobs:
  student-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: student-core/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
