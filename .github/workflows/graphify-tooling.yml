name: Graphify Tooling

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  graphify-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Graphify with MCP support
        run: python -m pip install --disable-pip-version-check 'graphifyy[mcp]==0.9.58'
      - name: Verify committed graph exists
        run: test -s graphify-out/graph.json && test -s graphify-out/code-fingerprint.json
      - name: Reject stale graph
        run: node tooling/graphify/fingerprint.mjs --check=graphify-out/code-fingerprint.json
      - name: Smoke-query committed graph
        run: graphify query 'repository architecture' --budget 300 --graph graphify-out/graph.json >/dev/null
